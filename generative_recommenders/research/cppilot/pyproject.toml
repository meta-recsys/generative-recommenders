[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cppilot"
version = "0.1.0"
description = "A small, provider-neutral framework for tool-using agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "CPPilot contributors"}]
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
telemetry = ["opentelemetry-api>=1.28"]
podman = ["podman>=5.0"]
cli = []
dev = ["build>=1.2", "mypy>=1.13", "pytest>=8.3", "pytest-asyncio>=0.24"]
all = ["anthropic>=0.40", "google-genai>=1.0", "opentelemetry-api>=1.28", "podman>=5.0"]

[project.scripts]
cppilot = "cppilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cppilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

